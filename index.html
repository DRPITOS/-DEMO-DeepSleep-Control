<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSleep Bed Controller</title>
</head>
<body>
<div id="canvas-container"></div>

<div class="ui-header">
    <h1>DeepSleep</h1>
    <p>Drag the background to rotate the 3D camera</p>
</div>

<div class="controls">
    <div class="controls-title">Smart Bed Control</div>

    <div class="control-row">
        <div class="control-info">
            <span class="control-label">Head</span>
            <span class="control-value" id="head-val">0°</span>
        </div>
        <div class="button-group">
            <button id="btn-head-down">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                     stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
            <button id="btn-head-up">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                     stroke-linejoin="round">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
            </button>
        </div>
    </div>

    <div class="control-row">
        <div class="control-info">
            <span class="control-label">Thigh</span>
            <span class="control-value" id="thigh-val">0°</span>
        </div>
        <div class="button-group">
            <button id="btn-thigh-down">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <button id="btn-thigh-up">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
            </button>
        </div>
    </div>

    <div class="control-row">
        <div class="control-info">
            <span class="control-label">Foot</span>
            <span class="control-value" id="toe-val">0°</span>
        </div>
        <div class="button-group">
            <button id="btn-toe-down">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                     stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
            <button id="btn-toe-up">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                     stroke-linejoin="round">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
            </button>
        </div>
    </div>

    <div class="control-row">
        <div class="control-info">
            <span class="control-label">Side Hug</span>
            <span class="control-value" id="hug-val">0°</span>
        </div>
        <div class="button-group">
            <button id="btn-hug-down">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                     stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <button id="btn-hug-up">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                     stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>
    </div>
    <div class="control-row reset-row">
        <button id="btn-reset" class="reset-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                 stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
            </svg>
            <span>Reset to Flat</span>
        </button>
    </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
